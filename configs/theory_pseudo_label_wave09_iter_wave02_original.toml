version = "1"

# Phase 9 sub-iteration: margin-first + Scopus-only + optional cross-model + top-K per class.
# Run pseudo-label selection on Windows (CPU). Heavy training / full-corpus inference: WSL ROCm (see AGENTS.md).

trusted_source_artifact = "reports/tmp_phase6/trust_smoke/trusted_production_corpus.csv"
prediction_artifact = "reports/tmp_phase8/predict_smoke/predictions.csv"
promotion_gate_artifact = "reports/tmp_phase8/calibration_smoke/promotion_gate.json"

preferred_source_order = ["scopus_base", "google_corpus"]
allowed_source_datasets = ["scopus_base"]

minimum_abstract_words = 80
minimum_abstract_characters = 400
minimum_calibrated_prediction_score = 0.60
minimum_prediction_margin = 0.14
fallback_score_threshold = 0.68
fallback_margin_threshold = 0.18
weak_class_score_threshold = 0.80
weak_class_margin_threshold = 0.22

minimum_admitted_rows = 30
max_global_class_share = 0.35
pseudo_label_wave_id = "wave_09_iter_margin_scopus"
teacher_run_id = "sentence_transformer_logreg_test"
admission_policy_version = "phase9_review_iteration_v1"

# 9F: cap relative winners per class before recall-based caps and global share trim.
admission_top_k_per_class = 20

client_review_feedback_artifact = "reports/tmp_phase9/client_pack_wave02/client_micro_reviewed.csv"
excluded_review_outcomes = ["out_of_scope_theory", "insufficient_theory_signal"]
enable_conformal_gate = true
conformal_reference_predictions_artifact = "reports/phase7/benchmark/sentence_transformer_logreg/predictions.csv"
conformal_alpha = 0.20
conformal_minimum_correct_rows = 5

# 9E: require a second model_run_id (merge with scripts/merge_prediction_runs_for_pseudo_label.py).
# Example: merge champion + tfidf CSVs → set prediction_artifact to merged path, then:
#   require_cross_model_agreement = true
#   secondary_teacher_run_id = "tfidf_char_wb_logreg_test"
# (secondary_prediction_artifact only if the second run lives in a different file than prediction_artifact)
require_cross_model_agreement = false

gold_supervision_artifact = "reports/phase2_gold_supervision.csv"
split_artifact = "reports/phase2_split_assignments.csv"
metrics_per_class_artifact = "reports/phase7/benchmark/sentence_transformer_logreg/metrics_per_class.csv"
default_output_root = "reports/tmp_phase9"
champion_run_dir = "reports/phase7/benchmark/sentence_transformer_logreg"
trusted_production_artifact = "reports/tmp_phase6/trust_smoke/trusted_production_corpus.csv"
phase5_predictions_reference = "reports/phase5/full_corpus_inference_keywords/predictions.csv"

taxonomy_config = "configs/taxonomy.toml"
supervision_config = "configs/supervision.toml"
gold_artifact = "reports/phase2_gold_supervision.csv"
default_text_variant = "title_abstract_plus_keywords"
model_family = "sentence_transformer_logreg"
comparison_variants = ["abstract_only", "abstract_plus_keywords", "title_abstract_plus_keywords"]
candidate_model_families = ["tfidf_char_wb_logreg", "tfidf_svd_logreg", "sentence_transformer_logreg"]
baseline_anchor_run_dir = "reports/phase3/phase5_full_train_keywords"
baseline_anchor_predictions = "reports/phase5/full_corpus_inference_keywords/predictions.csv"
trusted_experiment_artifact = "reports/tmp_phase6/trust_smoke/trusted_experiment_corpus.csv"

[pseudo_training]
training_mode = "gold_plus_pseudo"
gold_weight = 1.0
pseudo_weight = 0.35
pseudo_admitted_csv = "reports/tmp_phase9/pseudo_label_wave09_iter/pseudo_label_admitted.csv"
pseudo_policy_json = "reports/tmp_phase9/pseudo_label_wave09_iter/pseudo_label_policy.json"

[training]
max_features = 12000
ngram_min = 1
ngram_max = 2
min_df = 1
max_iter = 2500
class_weight = "balanced"
random_state = 20260417
char_ngram_min = 3
char_ngram_max = 5
svd_components = 128
sentence_transformer_model_name = "sentence-transformers/all-MiniLM-L6-v2"
sentence_batch_size = 32

[evaluation]
default_split = "test"
required_retained_accuracy = 0.70
required_coverage_rate = 0.15

[runtime]
target_environment = "wsl_rocm"
target_device = "cuda"
runtime_budget_hours = 5.0
wsl_distribution = "Ubuntu-24.04"
