version = "2"
taxonomy_config = "configs/taxonomy.toml"
supervision_config = "configs/supervision.toml"
gold_artifact = "reports/tmp_phase9/gold_v3_wave03/phase2_gold_supervision_v3_wave03.csv"
split_artifact = "reports/tmp_phase9/gold_v3_wave03/phase2_split_assignments_v3_wave03.csv"
default_text_variant = "abstract_plus_keywords"
default_output_root = "reports/tmp_phase9/gold_v3_wave03/runs"
model_family = "sentence_transformer_logreg"
comparison_variants = ["abstract_only", "abstract_plus_keywords", "title_abstract_plus_keywords"]
candidate_model_families = ["tfidf_char_wb_logreg", "tfidf_svd_logreg", "sentence_transformer_logreg"]
baseline_anchor_run_dir = "reports/phase7/benchmark/sentence_transformer_logreg"
baseline_anchor_predictions = "reports/phase5/full_corpus_inference_keywords/predictions.csv"
trusted_experiment_artifact = "reports/tmp_phase6/trust_smoke/trusted_experiment_corpus.csv"
trusted_production_artifact = "reports/tmp_phase6/trust_smoke/trusted_production_corpus.csv"

[training]
max_features = 12000
ngram_min = 1
ngram_max = 2
min_df = 1
max_iter = 2500
class_weight = "balanced"
random_state = 20260508
char_ngram_min = 3
char_ngram_max = 5
svd_components = 128
sentence_transformer_model_name = "sentence-transformers/all-MiniLM-L6-v2"
sentence_batch_size = 32

[evaluation]
default_split = "test"
required_retained_accuracy = 0.70
required_coverage_rate = 0.15

[runtime]
target_environment = "wsl_rocm"
target_device = "cuda"
runtime_budget_hours = 5.0
wsl_distribution = "Ubuntu-24.04"
