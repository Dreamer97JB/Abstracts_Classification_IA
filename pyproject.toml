[project]
name = "abstracts-classification-ia"
version = "0.1.0"
description = "Refactor base for abstract classification, data auditing, and reproducible NLP pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
